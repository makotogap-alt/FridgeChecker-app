<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>購入品を確認 | Fridge Checker</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><main class="container"><a href="{{ url_for('receipt_home') }}">← 最初からやり直す</a><h1>購入した食品を確認</h1><p>認識に誤りがあれば修正してください。チェックを外すと登録されません。賞味期限は任意です。</p>
<form action="{{ url_for('receipt_confirm') }}" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="token" value="{{ token }}">
{% for item in items %}<section class="card receipt-review-card"><label class="receipt-check"><input type="checkbox" name="include_{{ loop.index0 }}" checked>この食品を登録する</label><div class="form-grid"><label>食品名<input name="name_{{ loop.index0 }}" value="{{ item.name }}" maxlength="100" required></label><label>数量<input type="number" name="quantity_{{ loop.index0 }}" min="1" max="10000" value="{{ item.quantity }}" required></label><label>単位<select name="unit_{{ loop.index0 }}">{% for u in units %}<option value="{{ u }}" {% if u == item.unit %}selected{% endif %}>{{ u }}</option>{% endfor %}</select></label><label>カテゴリ<select name="category_{{ loop.index0 }}">{% for c in categories %}<option value="{{ c }}" {% if c == item.category %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></label><label>賞味期限（任意）<input type="date" name="expiration_{{ loop.index0 }}" value="{{ item.expiration_date }}"></label></div></section>{% endfor %}
<button type="submit" class="receipt-confirm">チェックした食品を一括登録する</button></form></main></body></html>
