<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>レシートを読み取る | Fridge Checker</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><main class="container"><a href="{{ url_for('index') }}">← 冷蔵庫に戻る</a><h1>🧾 レシートから一括登録</h1><p>画像をアップロードすると購入した食品の候補を抽出します。確認してから在庫に追加します。</p>
{% if error %}<p class="receipt-error" role="alert">{{ error }}</p>{% endif %}
<section class="card"><h2>レシート画像を使う</h2><form method="post" action="{{ url_for('receipt_analyze') }}" enctype="multipart/form-data"><input type="hidden" name="csrf" value="{{ csrf }}"><label>レシート画像（JPEG / PNG / WebP、4MBまで）<input type="file" name="receipt" accept="image/jpeg,image/png,image/webp" capture="environment"></label><p class="subtitle">画像認識にはサーバー側のOPENAI_API_KEYが必要です。画像はこのアプリには保存せず、認識APIに送信します。</p><button type="submit">画像を読み取る</button></form></section>
<section class="card"><h2>商品をまとめて手入力</h2><p>APIキーがなくても使えます。1行に1商品、カンマ区切りで入力してください。</p><form method="post" action="{{ url_for('receipt_analyze') }}"><input type="hidden" name="csrf" value="{{ csrf }}"><label>商品名,数量,単位,カテゴリ<textarea name="manual" rows="5" maxlength="4000" placeholder="牛乳,2,本,乳製品&#10;卵,1,パック,卵&#10;ヨーグルト,3,個,乳製品" required></textarea></label><button type="submit">まとめて確認する</button></form></section></main></body></html>
